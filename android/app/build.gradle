plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hermes.movehubremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.hermes.movehubremote"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // none — pure Android SDK, no external libraries
}
